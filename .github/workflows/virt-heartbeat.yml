name: Virt autonomous heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  workflow_run:
    workflows:
      - Aether OS build
      - Aether QEMU GDB lab
    types: [completed]

concurrency:
  group: virt-autonomous-heartbeat
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  copilot-requests: write

jobs:
  heartbeat:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'failure' &&
           startsWith(github.event.workflow_run.head_branch, 'evolution/heartbeat-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Aether analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools jq unzip curl p7zip-full qemu-system-x86 ffmpeg librsvg2-bin gdb-multiarch binutils llvm expect tmux

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Prepare heartbeat context
        env:
          RECOVERY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RECOVERY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "TRIGGER=$TRIGGER_NAME"
          echo "RUN_ID=$RUN_ID"
          if [ -n "$RECOVERY_BRANCH" ]; then
            echo "RECOVERY_BRANCH=$RECOVERY_BRANCH"
            echo "RECOVERY_SHA=$RECOVERY_SHA"
          fi
          test -f .state/current_state.json
          jq empty .state/current_state.json
          if [ -f .state/dead_ends.json ]; then
            jq empty .state/dead_ends.json
          fi
          git log -5 --oneline --decorate
          git status --short

      - name: Run bounded autonomous engineering cycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVERY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RECOVERY_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          cat > /tmp/virt-heartbeat-prompt.md <<EOF
          You are the bounded Aether OS engineering heartbeat.

          Runtime values: RUN_ID=$RUN_ID TRIGGER_NAME=$TRIGGER_NAME RECOVERY_BRANCH=$RECOVERY_BRANCH RECOVERY_SHA=$RECOVERY_SHA

          This is an autonomous GitHub Actions cycle. Work directly in the checked-out repository, but never modify or push main directly.

          HARD SAFETY/QUALITY LIMITS
          - One logical engineering change maximum in this cycle.
          - One experiment branch maximum: evolution/heartbeat-${RUN_ID}.
          - Never force-push, delete unrelated branches, reset --hard, or rewrite history.
          - Never touch hardware-specific behavior unless current evidence makes it the single justified task.
          - Do not invent CI, QEMU, or AH532 evidence.
          - Do not create recursive heartbeat triggers.
          - If evidence is insufficient, stop and record that fact instead of guessing.
          - If the same concrete failure fingerprint has already failed three times, do not retry it. Record/update .state/dead_ends.json and put .state/current_state.json into bounded sleep until the next scheduled heartbeat.
          - Never create more than one PR from this heartbeat run.

          BOOT / MEMORY
          1. Read .state/current_state.json first.
          2. Read .state/dead_ends.json if it exists.
          3. Inspect the latest 5 commits.
          4. Read the relevant AGENTS.md / Copilot instructions and existing workflow/skill guidance.
          5. Inspect current open PRs/issues and recent Actions evidence relevant to the selected task.

          PERCEPTION
          Determine why this heartbeat exists:
          - scheduled heartbeat: inspect current state, open work, recent CI and choose one safe next action;
          - workflow_run failure: the failed run branch is supplied in RECOVERY_BRANCH/RECOVERY_SHA; inspect that branch's PR/check/log context and diagnose the concrete failure before editing.

          DECISION
          Choose exactly one:
          A) continue one justified hypothesis;
          B) diagnose/fix one concrete CI/QEMU failure;
          C) if blocked, record a bounded dead end and sleep.
          Prefer an existing concrete task over inventing a new one.

          EXECUTION
          - Start from main for a new scheduled experiment.
          - For CI recovery, continue the supplied evolution/heartbeat-* branch only if it is clearly the branch that failed.
          - Use branch name evolution/heartbeat-${RUN_ID} for a new experiment.
          - Make the smallest justified change.
          - Run the strongest available deterministic validation, including the existing Aether build/QEMU path when relevant.
          - Keep QEMU evidence separate from real-AH532 evidence.
          - Update .state/current_state.json with the exact hypothesis, action, evidence, result, and next bounded step.
          - On a repeated dead end, update .state/dead_ends.json with a stable failure fingerprint, evidence summary, attempt count, and a concrete reason not to retry blindly.

          GIT / PR
          - Do not commit directly on main.
          - Make exactly one logical commit for a successful experiment or a bounded dead-end state update.
          - Push only the evolution/heartbeat-* branch.
          - Create/update at most one PR targeting main.
          - For a successful experiment, use the PR as the only path toward main.
          - Do not merge until required checks are green. If repository policy requires human review or otherwise blocks merge, leave the PR open and record awaiting_review rather than bypassing policy.
          - If checks fail, diagnose from the actual logs. Do not make speculative fixes.
          - If three attempts produce the same concrete failure fingerprint, stop and record the dead end instead of looping.

          TERMINATION
          Finish this run after one logical change, one bounded dead-end record, or a verified no-op. Do not keep searching indefinitely.

          The repository itself is the persistent memory. Treat current source and current GitHub evidence as authoritative.
          EOF

          copilot -p "$(cat /tmp/virt-heartbeat-prompt.md)" -s             --no-ask-user             --allow-tool='write'             --allow-tool='shell(git:*)'             --allow-tool='shell(gh:*)'             --allow-tool='shell(make:*)'             --allow-tool='shell(qemu-system-x86_64)'             --allow-tool='shell(timeout)'             --allow-tool='shell(jq)'             --allow-tool='shell(grep)'             --allow-tool='shell(find)'             --allow-tool='shell(sed)'             --allow-tool='shell(cat)'             --allow-tool='shell(curl)'             --deny-tool='shell(git push origin main)'             --deny-tool='shell(git reset --hard)'             --deny-tool='shell(git clean)'             --deny-tool='shell(gh repo delete)'

      - name: Publish heartbeat evidence
        if: always()
        run: |
          {
            echo "## Virt heartbeat"
            echo
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- HEAD: $(git rev-parse HEAD)"
            echo
            echo '### State'
            cat .state/current_state.json
            if [ -f .state/dead_ends.json ]; then
              echo
              echo '### Dead ends'
              cat .state/dead_ends.json
            fi
            echo
            echo '### Git status'
            git status --short --branch
            echo
            echo '### Recent commits'
            git log -5 --oneline --decorate
          } >> "$GITHUB_STEP_SUMMARY"
