name: Aether QEMU Lab

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qemu-lab.yml"

jobs:
  qemu-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Aether build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools jq unzip curl qemu-system-x86

      - name: Fetch packaged Calculator ELF
        run: |
          set -eux
          mkdir -p kernel/build
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${{ github.token }}"             'https://api.github.com/repos/Apuoxo/aether-apps/contents/apps/calculator/dist/calculator.elf?ref=main'             | jq -r '.content' | tr -d '\n' | base64 -d > kernel/build/calculator.elf
          test -s kernel/build/calculator.elf

      - name: Build Aether ISO
        working-directory: kernel
        run: |
          make clean
          make kernel
          make iso
          test -s build/aether.iso
          sha256sum build/aether.iso | tee ../lab-results-iso-sha.txt

      - name: Run Aether in QEMU
        run: |
          set +e
          timeout 20s qemu-system-x86_64             -cdrom kernel/build/aether.iso             -serial file:/tmp/aether-qemu.log             -display none             -m 128M             -no-reboot
          rc=$?
          set -e
          mkdir -p lab-results
          cp /tmp/aether-qemu.log lab-results/aether-serial.log
          printf "qemu_exit_code=%s\n" "$rc" > lab-results/result.txt
          cat /tmp/aether-qemu.log
          test "$rc" -eq 124
          grep -q "\[INIT\] Calculator ELF bundled bytes=" /tmp/aether-qemu.log
          grep -q "\[CALC\] loaded bundled ELF bytes=" /tmp/aether-qemu.log
          grep -q "\[SYSCALL\] nr=12" /tmp/aether-qemu.log
          ! grep -q "PANIC" /tmp/aether-qemu.log
          ! grep -q "\[PF\] killing process" /tmp/aether-qemu.log

      - name: Publish Aether QEMU evidence
        uses: actions/upload-artifact@v4
        with:
          name: aether-qemu-lab
          path: |
            lab-results/
            lab-results-iso-sha.txt
