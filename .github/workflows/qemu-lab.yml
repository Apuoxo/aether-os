name: Aether QEMU Lab

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/qemu-lab.yml"

jobs:
  qemu-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and NASM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 nasm

      - name: Verify QEMU host
        run: |
          set -eux
          qemu-system-x86_64 --version
          command -v qemu-system-x86_64
          command -v nasm

      - name: Build minimal boot experiment
        run: |
          set -eux
          cat > /tmp/qemu-lab.asm <<'EOF'
          bits 16
          org 0x7c00

          cli
          xor ax, ax
          mov ds, ax
          mov ss, ax
          mov sp, 0x7c00

          mov si, message
          call serial_init

          .loop:
            lodsb
            test al, al
            jz .halt
            call serial_putc
            jmp .loop

          .halt:
            cli
            hlt
            jmp .halt

          serial_init:
            mov dx, 0x3f9
            mov al, 0
            out dx, al
            mov dx, 0x3fb
            mov al, 0x80
            out dx, al
            mov dx, 0x3f8
            mov al, 1
            out dx, al
            mov dx, 0x3f9
            mov al, 0
            out dx, al
            mov dx, 0x3fb
            mov al, 3
            out dx, al
            ret

          serial_putc:
            push ax
            push dx
          .wait:
            mov dx, 0x3fd
            in al, dx
            test al, 0x20
            jz .wait
            mov dx, 0x3f8
            pop dx
            pop ax
            out dx, al
            ret

          message db "AETHER-QEMU-LAB: BOOT OK", 13, 10, 0

          times 510-($-$$) db 0
          dw 0xaa55
          EOF

          nasm -f bin /tmp/qemu-lab.asm -o /tmp/qemu-lab.bin
          test `stat -c %s /tmp/qemu-lab.bin` -eq 512
          mkdir -p lab-results
          cp /tmp/qemu-lab.bin lab-results/qemu-lab-boot.bin

      - name: Run QEMU experiment
        run: |
          set +e
          timeout 5s qemu-system-x86_64             -drive format=raw,file=/tmp/qemu-lab.bin,if=floppy             -display none             -serial file:/tmp/qemu-lab.log             -monitor none             -no-reboot             -no-shutdown
          rc=$?
          set -e
          cat /tmp/qemu-lab.log
          cp /tmp/qemu-lab.log lab-results/serial.log
          printf "timeout_exit_code=%s\n" "$rc" | tee lab-results/result.txt
          grep -q "AETHER-QEMU-LAB: BOOT OK" /tmp/qemu-lab.log
          test "$rc" -eq 124

      - name: Publish experiment results
        uses: actions/upload-artifact@v4
        with:
          name: qemu-lab-results
          path: lab-results/
