name: KEMU ISO boot validation

on:
  push:
    branches:
      - iso-boot-scan-2026-10-08
  workflow_dispatch:

jobs:
  kemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Aether
        uses: actions/checkout@v4

      - name: Install KEMU build and ISO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libslirp-dev \
            libcap-ng-dev libattr1-dev libaio-dev liburing-dev \
            libusb-1.0-0-dev libfdt-dev libepoxy-dev \
            libdrm-dev libgtk-3-dev python3 python3-venv \
            debootstrap squashfs-tools grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools cpio busybox-static xz-utils

      - name: Download and unpack official QEMU
        run: |
          mkdir -p .kemu/src .kemu/build
          curl -fL --retry 3 --retry-delay 2 \
            https://download.qemu.org/qemu-11.1.2.tar.xz \
            -o .kemu/qemu-11.1.2.tar.xz
          tar -xJf .kemu/qemu-11.1.2.tar.xz -C .kemu/src
          test -f .kemu/src/qemu-11.1.2/configure

      - name: Build KEMU
        run: |
          cd .kemu/build
          ../src/qemu-11.1.2/configure \
            --target-list=x86_64-softmmu \
            --disable-docs \
            --disable-werror \
            --enable-slirp
          make -j2
          ./.kemu/build/qemu-system-x86_64 --version

      - name: Build current Aether ISO
        run: |
          chmod +x tools/build-boot-image.sh
          sudo tools/build-boot-image.sh
          test -s out/aether-os-6.18.55-x86_64.iso

      - name: Boot ISO in KEMU
        run: |
          mkdir -p .kemu/run
          timeout 150s .kemu/build/qemu-system-x86_64 \
            -machine q35,accel=tcg \
            -m 2048 \
            -smp 2 \
            -cpu max \
            -device virtio-vga \
            -drive file=out/aether-os-6.18.55-x86_64.iso,media=cdrom,readonly=on \
            -boot d \
            -serial file:.kemu/run/serial.log \
            -display none \
            -no-reboot \
            -monitor none || true
          cat .kemu/run/serial.log

      - name: Validate boot and desktop readiness
        run: |
          grep -q 'AETHER_GUI=READY' .kemu/run/serial.log
          grep -q 'AETHER_AI_BRIDGE=READY' .kemu/run/serial.log

      - name: Upload KEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kemu-boot-evidence
          path: |
            .kemu/run/serial.log
            out/aether-os-6.18.55-x86_64.iso
          if-no-files-found: warn
