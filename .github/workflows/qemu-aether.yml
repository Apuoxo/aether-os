name: Aether QEMU boot diagnostic

on:
  push:
    paths:
      - '.github/workflows/qemu-aether.yml'
  workflow_dispatch:

jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install QEMU and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils nasm grub-pc-bin grub-common xorriso mtools
          qemu-system-x86_64 --version
      - name: Locate build system
        run: |
          set -eux
          find . -maxdepth 3 -type f \( -name 'Makefile' -o -name 'Cargo.toml' -o -name '*.iso' -o -name '*.img' \) -print | sort
      - name: Build Aether
        run: |
          set -eux
          if [ -x ./build.sh ]; then ./build.sh;
          elif [ -f ./Makefile ]; then make;
          elif [ -f ./Cargo.toml ]; then cargo build;
          else echo "NO_SUPPORTED_BUILD_ENTRYPOINT"; exit 1; fi
      - name: Find boot image
        run: |
          set -eux
          find . -type f \( -name '*.iso' -o -name '*.img' -o -name '*.bin' \) -not -path './target/*' -print | sort
      - name: Boot Aether under QEMU
        run: |
          set -eux
          IMAGE=$(find . -type f \( -name '*.iso' -o -name '*.img' \) -not -path './target/*' | head -n1)
          test -n "$IMAGE"
          timeout 30s qemu-system-x86_64 -machine pc -cpu qemu64 -m 512M -serial stdio -display none -no-reboot -no-shutdown -cdrom "$IMAGE" 2>&1 | tee qemu.log || true
      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-qemu-log
          path: qemu.log
          if-no-files-found: warn
