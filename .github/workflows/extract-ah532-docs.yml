name: Extract AH532 service documentation

on:
  push:
    paths:
      - 'DA0FH6MB6E0 rev E PDF .rar'
      - '.github/workflows/extract-ah532-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extraction and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils tesseract-ocr

      - name: Extract RAR
        run: |
          rm -rf docs/AH532-SERVICE-MANUAL
          mkdir -p docs/AH532-SERVICE-MANUAL
          7z x 'DA0FH6MB6E0 rev E PDF .rar' -odocs/AH532-SERVICE-MANUAL -y

      - name: Extract searchable text and OCR fallback
        shell: bash
        run: |
          set -e
          pdf='docs/AH532-SERVICE-MANUAL/DA0FH6MB6E0 rev E PDF .pdf'
          pdftotext -layout "$pdf" docs/AH532-SERVICE-MANUAL/manual-text.txt || true
          chars=$(wc -c < docs/AH532-SERVICE-MANUAL/manual-text.txt || echo 0)
          echo "pdftotext character count: $chars"
          if [ "$chars" -lt 1000 ]; then
            rm -rf /tmp/ah532-ocr
            mkdir -p /tmp/ah532-ocr
            pdftoppm -jpeg -r 180 "$pdf" /tmp/ah532-ocr/page >/dev/null 2>&1 || true
            : > docs/AH532-SERVICE-MANUAL/manual-ocr.txt
            for img in /tmp/ah532-ocr/page-*.jpg; do
              [ -e "$img" ] || continue
              tesseract "$img" stdout 2>/dev/null >> docs/AH532-SERVICE-MANUAL/manual-ocr.txt || true
              printf '\n\n--- PAGE ---\n\n' >> docs/AH532-SERVICE-MANUAL/manual-ocr.txt
            done
          fi

      - name: Verify document identity
        shell: bash
        run: |
          set -e
          dir='docs/AH532-SERVICE-MANUAL'
          pdf="$dir/DA0FH6MB6E0 rev E PDF .pdf"
          text="$dir/manual-text.txt"
          report="$dir/manual-identity-report.md"

          pdfinfo "$pdf" > "$dir/pdfinfo.txt" 2>&1 || true
          pdftotext -f 1 -l 12 -layout "$pdf" "$dir/first-pages.txt" || true

          {
            echo "# Manual identity verification"
            echo
            echo "## File"
            echo "- PDF: `$(basename "$pdf")`"
            echo "- SHA-256: `$(sha256sum "$pdf" | awk '{print $1}')`"
            echo "- Size: $(stat -c%s "$pdf") bytes"
            echo
            echo "## PDF metadata"
            sed -n '1,40p' "$dir/pdfinfo.txt"
            echo
            echo "## Direct identity matches"
            echo 'Search terms: AH532, LIFEBOOK, FUJITSU, DA0FH6MB6E0, MBDA0FH6MB6E0, FH6MB6E0'
            echo
            if grep -Ein -m 80 -C 2 'AH532|LIFEBOOK|FUJITSU|DA0FH6MB6E0|MBDA0FH6MB6E0|FH6MB6E0' "$text" > "$dir/identity-matches.txt"; then
              sed -n '1,240p' "$dir/identity-matches.txt"
            else
              echo "NO_MATCHES_IN_EXTRACTED_TEXT"
            fi
            echo
            echo "## First 12 pages — identity-related lines"
            if grep -Ein -C 2 'AH532|LIFEBOOK|FUJITSU|DA0FH6MB6E0|MBDA0FH6MB6E0|FH6MB6E0' "$dir/first-pages.txt"; then
              true
            else
              echo "NO_MATCHES_IN_FIRST_12_PAGES"
            fi
            echo
            echo "## Preliminary assessment"
            if grep -Eiq 'AH532|LIFEBOOK AH532' "$text"; then
              echo "DIRECT_MODEL_IDENTIFIER_FOUND: The extracted text contains AH532/LIFEBOOK AH532. This is direct evidence of model relevance."
            elif grep -Eiq 'DA0FH6MB6E0|MBDA0FH6MB6E0|FH6MB6E0' "$text"; then
              echo "BOARD_IDENTIFIER_FOUND_BUT_MODEL_NOT_CONFIRMED: A matching board identifier appears, but AH532 was not found in extracted text. Corroboration is required before treating this as AH532-specific."
            else
              echo "NO_DIRECT_AH532_OR_BOARD_IDENTIFIER_FOUND: Do not treat this document as AH532-specific without further evidence."
            fi
          } > "$report"

      - name: Commit extracted documents and identity verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/AH532-SERVICE-MANUAL
          git diff --cached --quiet || git commit -m 'docs: verify service manual identity'
          git push
