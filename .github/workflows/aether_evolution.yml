name: Aether evolution validation

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.state/**'
      - 'AGENT_AXIOMS.md'
      - '.github/workflows/aether_evolution.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - '.state/**'
      - 'AGENT_AXIOMS.md'
      - '.github/workflows/aether_evolution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             nasm grub-pc-bin grub-common xorriso mtools jq unzip curl             p7zip-full qemu-system-x86 ffmpeg

      - name: Validate persistent state
        run: |
          set -euo pipefail
          test -f .state/current_state.json
          jq empty .state/current_state.json

      - name: Fetch packaged Calculator ELF
        run: |
          set -euo pipefail
          mkdir -p kernel/build
          curl -fsSL             -H 'Accept: application/vnd.github+json'             -H "Authorization: Bearer ${{ github.token }}"             'https://api.github.com/repos/Apuoxo/aether-apps/contents/apps/calculator/dist/calculator.elf?ref=main'             | jq -r '.content' | tr -d '\n' | base64 -d > kernel/build/calculator.elf
          test -s kernel/build/calculator.elf

      - name: Build kernel
        working-directory: kernel
        run: |
          make clean
          make kernel

      - name: Build ISO
        working-directory: kernel
        run: make iso

      - name: Boot and validate in QEMU
        run: |
          set +e
          timeout 20s qemu-system-x86_64             -cdrom kernel/build/aether.iso             -serial file:/tmp/aether-evolution-qemu.log             -display none             -m 128M             -no-reboot
          rc=$?
          set -e
          cat /tmp/aether-evolution-qemu.log
          echo "QEMU_EXIT=$rc"

          test "$rc" = 0 || test "$rc" = 124
          ! grep -qi "PANIC" /tmp/aether-evolution-qemu.log
          grep -qi "Aether OS Build" /tmp/aether-evolution-qemu.log

      - name: Publish QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-evolution-qemu-evidence
          path: /tmp/aether-evolution-qemu.log
