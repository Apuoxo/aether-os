name: Aether evolution validation

on:
  push:
    branches: [main]
    paths:
      - 'kernel/**'
      - '.state/**'
      - 'AGENT_AXIOMS.md'
      - '.aether/**'
      - '.github/workflows/aether_evolution.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - '.state/**'
      - 'AGENT_AXIOMS.md'
      - '.aether/**'
      - '.github/workflows/aether_evolution.yml'
  workflow_dispatch:

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: aether-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm grub-pc-bin grub-common xorriso mtools jq unzip curl \
            p7zip-full qemu-system-x86 ffmpeg librsvg2-bin

      - name: Validate persistent state
        run: |
          set -euo pipefail
          test -f .state/current_state.json
          jq empty .state/current_state.json
          test -f .state/history.json
          jq empty .state/history.json

      - name: Fetch packaged Calculator ELF
        run: |
          set -euo pipefail
          mkdir -p kernel/build
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            'https://api.github.com/repos/Apuoxo/aether-apps/contents/apps/calculator/dist/calculator.elf?ref=main' \
            | jq -r '.content' | tr -d '\n' | base64 -d > kernel/build/calculator.elf
          test -s kernel/build/calculator.elf

      - name: Build kernel
        working-directory: kernel
        run: |
          make clean
          make kernel

      - name: Build ISO
        working-directory: kernel
        run: make iso

      - name: Install model bridge
        run: npm install -g @github/copilot

      - name: Boot QEMU with bidirectional AI bridge
        id: qemu
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
        run: |
          set +e
          python3 .aether/tools/model_bridge.py \
            --host 127.0.0.1 \
            --port 45454 \
            --inject "What is Aether OS and what is this text channel?" \
            --model "auto" \
            > /tmp/aether-model-bridge.log 2>&1 &
          BRIDGE_PID=$!
          timeout 70s qemu-system-x86_64 \
            -cdrom kernel/build/aether.iso \
            -serial tcp:127.0.0.1:45454,server=on,wait=off,nodelay=on \
            -display none \
            -m 128M \
            -no-reboot
          rc=$?
          kill "$BRIDGE_PID" 2>/dev/null || true
          wait "$BRIDGE_PID" 2>/dev/null || true
          echo "QEMU_EXIT=$rc" | tee /tmp/aether-evolution-qemu.exit
          cat /tmp/aether-model-bridge.log
          test "$rc" = 0 || test "$rc" = 124
          ! grep -qi "PANIC" /tmp/aether-model-bridge.log

      - name: Analyze QEMU experience
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/aether-evolution-qemu.exit ]; then
            rc="$(cut -d= -f2 /tmp/aether-evolution-qemu.exit)"
          else
            rc=255
          fi
          python3 .aether/tools/analyze_run.py \
            --log /tmp/aether-model-bridge.log \
            --state .state/current_state.json \
            --history .state/history.json \
            --report .state/latest_qemu_report.json \
            --qemu-exit "$rc"

      - name: Verify bidirectional AI bridge
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/aether-model-bridge.log
          grep -q '^AI_STATUS:ACTIVE$' /tmp/aether-model-bridge.log
          grep -q '^AI_IN:' /tmp/aether-model-bridge.log
          grep -q '^AI_REQ:' /tmp/aether-model-bridge.log
          grep -q '^AI_RES:' /tmp/aether-model-bridge.log
          ! grep -q '^AI_RES:REQ=.*:MODEL_ERROR' /tmp/aether-model-bridge.log
          echo "BIDIRECTIONAL_AI_BRIDGE=PASS"

      - name: Persist analyzed experience
        if: always() && hashFiles('.state/latest_qemu_report.json') != '' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/current_state.json .state/history.json .state/latest_qemu_report.json
          if git diff --cached --quiet; then
            echo "No new experience to persist."
            exit 0
          fi
          git commit -m "agent: record analyzed QEMU experience [aether-state]"
          git push

      - name: Publish QEMU, ISO, and analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-evolution-build
          path: |
            kernel/build/aether.iso
            /tmp/aether-model-bridge.log
            /tmp/aether-evolution-qemu.exit
            .state/latest_qemu_report.json
          if-no-files-found: error
