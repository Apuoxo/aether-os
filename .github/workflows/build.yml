name: Aether OS boot image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          timeout 12m sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            cpio \
            debootstrap \
            flex \
            grub-pc-bin \
            grub-common \
            libelf-dev \
            libssl-dev \
            busybox-static \
            curl \
            mtools \
            squashfs-tools \
            xorriso \
            xz-utils \
            qemu-system-x86

      - name: Build bootable Linux desktop image
        run: sudo make boot-image

      - name: QEMU Linux boot and desktop smoke test
        run: |
          set -o pipefail
          timeout 60s qemu-system-x86_64 \
            -cdrom out/aether-os-6.18.55-x86_64.iso \
            -m 2048 \
            -smp 2 \
            -vga virtio \
            -display none \
            -serial stdio 2>&1 | tee qemu.log || test ${PIPESTATUS[0]} -eq 124
          grep -q "AETHER_AI_BRIDGE=READY" qemu.log
          grep -q "AETHER_GUI=READY" qemu.log

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-linux-desktop-x86_64
          path: out/aether-os-6.18.55-x86_64.iso
          if-no-files-found: error
