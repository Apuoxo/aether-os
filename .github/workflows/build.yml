name: Aether OS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools jq unzip curl
      - name: Fetch latest Calculator ELF from Aether Apps
        run: |
          set -e
          url="$(curl -fsSL 'https://api.github.com/repos/Apuoxo/aether-apps/actions/artifacts?name=aether-calculator-elf&per_page=100' | jq -r '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | last | .archive_download_url')"
          test "$url" != "null"
          mkdir -p kernel/build
          curl -fsSL "$url" -o /tmp/aether-calculator.zip
          unzip -o /tmp/aether-calculator.zip -d /tmp/aether-calculator
          test -s /tmp/aether-calculator/calculator
          cp /tmp/aether-calculator/calculator kernel/build/calculator.elf

      - name: Build kernel
        working-directory: kernel
        run: make clean kernel
      - name: Build ISO
        working-directory: kernel
        run: make iso
      - name: Publish ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-iso
          path: kernel/build/aether.iso
