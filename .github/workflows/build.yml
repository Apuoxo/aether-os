name: Aether OS boot image

on:
  push:
    branches: [main, kemu-codespace-lab-2026-10-08]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          timeout 8m sudo apt-get update -o Acquire::Retries=3
          timeout 12m sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            cpio \
            debootstrap \
            flex \
            grub-pc-bin \
            grub-common \
            libelf-dev \
            libssl-dev \
            busybox-static \
            curl \
            mtools \
            squashfs-tools \
            xorriso \
            xz-utils \
            qemu-system-x86

      - name: Build bootable Linux desktop image
        run: sudo make boot-image

      - name: KEMU guest-state verification
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y python3
          .kemu/run.sh out/aether-os-6.18.55-x86_64.iso
      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-linux-desktop-x86_64
          path: out/aether-os-6.18.55-x86_64.iso
          if-no-files-found: error
