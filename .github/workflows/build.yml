name: Aether OS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools jq unzip curl qemu-system-x86
      - name: Clean kernel build directory
        working-directory: kernel
        run: make clean

      - name: Fetch packaged Calculator ELF from Aether Apps
        run: |
          set -e
          mkdir -p kernel/build
          curl -fsSL -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${{ github.token }}" \
            'https://api.github.com/repos/Apuoxo/aether-apps/contents/apps/calculator/dist/calculator.elf?ref=main' \
            | jq -r '.content' | tr -d '\n' | base64 -d > kernel/build/calculator.elf
          test -s kernel/build/calculator.elf
          file kernel/build/calculator.elf

      - name: Build kernel
        working-directory: kernel
        run: make kernel
      - name: Build ISO
        working-directory: kernel
        run: make iso
      - name: QEMU native-app smoke test
        run: |
          set +e
          timeout 20s qemu-system-x86_64 -cdrom kernel/build/aether.iso -serial file:/tmp/aether-qemu.log -display none -m 128M -no-reboot
          rc=$?
          cat /tmp/aether-qemu.log
          test "$rc" -eq 124
          grep -q "\[INIT\] Calculator ELF bundled bytes=" /tmp/aether-qemu.log
          grep -q "\[CALC\] loaded bundled ELF bytes=" /tmp/aether-qemu.log
          grep -q "\[SYSCALL\] nr=12" /tmp/aether-qemu.log
          ! grep -q "PANIC" /tmp/aether-qemu.log
          ! grep -q "\[PF\] killing process" /tmp/aether-qemu.log

      - name: Publish ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-iso
          path: kernel/build/aether.iso
