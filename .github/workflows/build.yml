name: Aether OS — Linux boot image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aether
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev grub-pc-bin grub-common xorriso busybox-static cpio

      - name: Configure Linux
        run: make linux-config

      - name: Build Linux
        run: make linux-build

      - name: Build Aether initramfs
        run: ./tools/build-initramfs.sh

      - name: Build bootable ISO
        run: ./tools/build-iso.sh

      - name: Smoke test in QEMU
        run: |
          sudo apt-get install -y qemu-system-x86
          timeout 20s qemu-system-x86_64 -cdrom build/aether-os.iso -m 512 -nographic -serial mon:stdio -no-reboot -no-shutdown > build/qemu.log 2>&1 || test $? -eq 124
          grep -q "AETHER AI OS" build/qemu.log
          grep -q "Aether Core IPC: READY" build/qemu.log

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-os-iso
          path: build/aether-os.iso
          if-no-files-found: error

      - name: Upload QEMU log
        uses: actions/upload-artifact@v4
        with:
          name: aether-qemu-log
          path: build/qemu.log
          if-no-files-found: error
