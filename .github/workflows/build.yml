name: Aether OS build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y nasm grub-pc-bin grub-common xorriso mtools jq unzip curl
      - name: Clean kernel build directory
        working-directory: kernel
        run: make clean

      - name: Fetch packaged Calculator ELF from Aether Apps
        run: |
          set -e
          mkdir -p kernel/build
          curl -fsSL 'https://raw.githubusercontent.com/Apuoxo/aether-apps/main/apps/calculator/dist/calculator.elf' -o kernel/build/calculator.elf
          test -s kernel/build/calculator.elf
          file kernel/build/calculator.elf

      - name: Build kernel
        working-directory: kernel
        run: make kernel
      - name: Build ISO
        working-directory: kernel
        run: make iso
      - name: Publish ISO
        uses: actions/upload-artifact@v4
        with:
          name: aether-iso
          path: kernel/build/aether.iso
